name: JacobsContest
version: '1.0.0'
main: com.jacobscontest.JacobsContest
api-version: '1.21'
authors: [VoltexaLeader]
description: Competitive crop farming contests with percentage-based bracket rewards
softdepend:
  - PlaceholderAPI
commands:
  jacobscontest:
    description: Manage Jacob's Contest events
    usage: /jacobscontest <start|stop|reload|status> [event]
    permission: jacobscontest.admin
    aliases: [jc, jacobs]
permissions:
  jacobscontest.admin:
    description: Access to all Jacob's Contest commands
    default: op
