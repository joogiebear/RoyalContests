# ============================================
#     Jacob's Contest - Main Configuration
# ============================================
# Other configs:
#   lang.yml     - All messages and text
#   brackets.yml - Bracket definitions and rewards
#   events.yml   - Event definitions and rotation

# ============================================
#            Data Storage
# ============================================
# Options: sqlite (local file) or mysql (remote database)
# SQLite is simple and requires no setup — great for single servers.
# MySQL is recommended for networks or if you want external access (web leaderboards, etc.)
storage:
  type: sqlite
  # MySQL settings (only used when type is set to 'mysql')
  mysql:
    host: localhost
    port: 3306
    database: jacobscontest
    username: root
    password: ""

settings:
  # Default contest duration (can be overridden per event in events.yml)
  default-duration: 20m
  # Default countdown before contest starts
  countdown: 2m
  # Display method: ACTION_BAR or BOSS_BAR
  display: BOSS_BAR
  # BossBar color: BLUE, GREEN, RED, YELLOW, PURPLE, PINK, WHITE
  bossbar-color: YELLOW
  # Sound played when contest starts (Bukkit sound enum name)
  start-sound: "ENTITY_PLAYER_LEVELUP"
  # Sound played when contest ends
  end-sound: "ENTITY_FIREWORK_ROCKET_BLAST"

  # ---- Skill Requirement ----
  # Players must meet this to participate.
  # Uses PlaceholderAPI — works with EcoSkills, AuraSkills, mcMMO, etc.
  skill-requirement:
    enabled: true
    # PAPI placeholder to check (without % signs)
    placeholder: "ecoskills_farming"
    # Minimum value required
    minimum: 10
    # Message when player doesn't qualify
    deny-message: "&cYou need &6Farming Level 10 &cto participate in Jacob's Contest!"

  # ---- Minimum Score ----
  # Players must score at least this much to earn ANY rewards.
  minimum-score: 100
  minimum-score-message: "&cYou need at least &6100 crops &cto earn rewards! You collected &6%score%&c."

  # ---- Auto Rotation ----
  auto-rotation:
    enabled: true
    # Break time between contests (after one ends, before next countdown)
    # 1h = roughly 3 in-game days
    break-between: 1h
    # Announce the next contest during the break
    announce-next: true

# ============================================
#           Scoring Mode
# ============================================
# How contest scores are calculated.
#
# Options:
#   AURORA_COLLECTIONS - Uses AuroraCollections PAPI placeholders.
#                        Snapshots count at lock-in, compares at end.
#                        Captures everything: Fortune, Eco, pets, virtual bags.
#                        Requires: AuroraCollections + PlaceholderAPI
#
#   PLACEHOLDER        - Uses any custom PAPI placeholder you configure.
#                        Same snapshot approach as AURORA_COLLECTIONS.
#                        Great for integrating with ANY stats plugin.
#                        Requires: PlaceholderAPI + the placeholder plugin
#
#   DROPS              - Counts actual item drops from broken crops.
#                        Captures Fortune and most plugin-modified drops.
#                        May miss virtual bag pickups.
#                        Requires: nothing extra
#
#   BLOCK_BREAK        - Simple 1 point per crop block broken.
#                        Most reliable, works everywhere.
#                        Does NOT count Fortune or drop modifiers.
#                        Requires: nothing extra

scoring:
  mode: AURORA_COLLECTIONS

  # ---- AURORA_COLLECTIONS settings ----
  aurora:
    category: farming
    # Maps block material -> AuroraCollections collection ID
    collection-ids:
      WHEAT: wheat
      CARROTS: carrot
      POTATOES: potato
      BEETROOTS: beetroot
      NETHER_WART: netherwart
      MELON: melon
      PUMPKIN: pumpkin
      COCOA: cocoa
      SUGAR_CANE: sugar_cane
      CACTUS: cactus

  # ---- PLACEHOLDER settings ----
  # Use any PAPI placeholder. %crop% is replaced with the collection ID from above.
  placeholder:
    # The placeholder template. %crop% will be replaced with the crop's collection ID.
    template: "%aurora_collections_farming_%crop%_count_raw%"

  # ---- DROPS settings ----
  drops:
    # Point values per item type (material name or ecoitems:id)
    point-values:
      WHEAT: 1
      CARROT: 1
      POTATO: 1
      BEETROOT: 1
      NETHER_WART: 1
      MELON_SLICE: 1
      PUMPKIN: 1
      WHEAT_SEEDS: 0
      BEETROOT_SEEDS: 0
      # EcoItems example:
      # ecoitems:enchanted_wheat: 5
