# ============================================
#     Jacob's Contest - Bracket Definitions
# ============================================
# threshold = top X% of participants qualify
# Brackets are checked top-down (strictest first).
#
# Reward commands run as console. Available placeholders:
#   %player%   - player name
#   %crop%     - crop the player farmed (lowercase, e.g. "wheat")
#   %score%    - number of points scored
#   %bracket%  - bracket name (DIAMOND, GOLD, etc.)
#   %position% - player's rank number

DIAMOND:
  threshold: 2
  color: "&b"
  display-name: "&b&lDIAMOND"
  commands:
    - "eco give %player% gold_medal 1"
    - "eco give %player% silver_medal 1"
    - "eco give %player% jacobs_ticket 35"
    - "eco give %player% carnival_ticket 3"
    - "eco give %player% turbo_crop_%crop%_1 1"

PLATINUM:
  threshold: 5
  color: "&7"
  display-name: "&7&lPLATINUM"
  commands:
    - "eco give %player% gold_medal 1"
    - "eco give %player% bronze_medal 1"
    - "eco give %player% jacobs_ticket 30"
    - "eco give %player% carnival_ticket 2"
    - "eco give %player% turbo_crop_%crop%_1 1"

GOLD:
  threshold: 10
  color: "&6"
  display-name: "&6&lGOLD"
  commands:
    - "eco give %player% gold_medal 1"
    - "eco give %player% jacobs_ticket 25"
    - "eco give %player% carnival_ticket 2"
    - "eco give %player% turbo_crop_%crop%_1 1"

SILVER:
  threshold: 30
  color: "&f"
  display-name: "&f&lSILVER"
  commands:
    - "eco give %player% silver_medal 1"
    - "eco give %player% jacobs_ticket 15"
    - "eco give %player% carnival_ticket 1"
    - "eco give %player% turbo_crop_%crop%_1 1"

BRONZE:
  threshold: 60
  color: "&c"
  display-name: "&c&lBRONZE"
  commands:
    - "eco give %player% bronze_medal 1"
    - "eco give %player% jacobs_ticket 10"
    - "eco give %player% carnival_ticket 1"
    - "eco give %player% turbo_crop_%crop%_1 1"

NONE:
  threshold: 100
  color: "&7"
  display-name: "&7NONE"
  commands:
    - "eco give %player% jacobs_ticket 1"
