# ============================================
#     Jacob's Contest - Main Configuration
# ============================================
# Other configs:
#   lang.yml     - All messages and text
#   brackets.yml - Bracket definitions and rewards
#   events.yml   - Event definitions and rotation

settings:
  # Default contest duration (can be overridden per event in events.yml)
  default-duration: 20m
  # Default countdown before contest starts
  countdown: 2m
  # Display method: ACTION_BAR or BOSS_BAR
  display: BOSS_BAR
  # BossBar color: BLUE, GREEN, RED, YELLOW, PURPLE, PINK, WHITE
  bossbar-color: YELLOW
  # Sound played when contest starts (Bukkit sound enum name)
  start-sound: "ENTITY_PLAYER_LEVELUP"
  # Sound played when contest ends
  end-sound: "ENTITY_FIREWORK_ROCKET_BLAST"

  # ---- Skill Requirement ----
  # Players must meet this to participate.
  # Uses PlaceholderAPI — works with EcoSkills, AuraSkills, mcMMO, etc.
  skill-requirement:
    enabled: true
    # PAPI placeholder to check (without % signs)
    placeholder: "ecoskills_farming_level"
    # Minimum value required
    minimum: 10
    # Message when player doesn't qualify
    deny-message: "&cYou need &6Farming Level 10 &cto participate in Jacob's Contest!"

  # ---- Minimum Score ----
  # Players must score at least this much to earn ANY rewards.
  minimum-score: 100
  minimum-score-message: "&cYou need at least &6100 crops &cto earn rewards! You collected &6%score%&c."

  # ---- Auto Rotation ----
  auto-rotation:
    enabled: true
    # Break time between contests (after one ends, before next countdown)
    # 1h = roughly 3 in-game days
    break-between: 1h
    # Announce the next contest during the break
    announce-next: true

# ============================================
#     Point Values Per Item Drop
# ============================================
# Scoring is based on ACTUAL ITEM DROPS, not block breaks.
# Fortune, Eco enchants, pets, talismans, reforges, etc.
# all affect drops and therefore affect score.
#
# Vanilla items use their MATERIAL name.
# EcoItems use "ecoitems:item_id" format.
# Any item not listed = 0 points (ignored).

point-values:
  # Vanilla crop drops
  WHEAT: 1
  CARROT: 1
  POTATO: 1
  BEETROOT: 1
  NETHER_WART: 1
  MELON_SLICE: 1
  PUMPKIN: 1
  # Seeds don't count
  WHEAT_SEEDS: 0
  BEETROOT_SEEDS: 0
  # EcoItems — enchanted crops worth more
  # Uncomment and set your actual EcoItems IDs:
  # ecoitems:enchanted_wheat: 5
  # ecoitems:enchanted_carrot: 5
  # ecoitems:enchanted_potato: 5
  # ecoitems:enchanted_nether_wart: 5
  # ecoitems:enchanted_melon: 10
  # ecoitems:enchanted_pumpkin: 10
