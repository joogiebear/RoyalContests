# ═══════════════════════════════════════════════════════════════════════════════
#  RoyalContests  ·  config.yml
# ═══════════════════════════════════════════════════════════════════════════════
#  Other files:  crops.yml (what counts)  ·  events.yml (what runs)
#                brackets.yml (rewards)   ·  messages.yml  ·  menus.yml
#  Reload with /royalcontests reload. A contest already running keeps its settings.
#  Durations: 20m, 1h30m, 45s …
# ═══════════════════════════════════════════════════════════════════════════════

# ── When contests run ─────────────────────────────────────────────────────────
schedule:
  # interval — on the clock, every `interval` (like Hypixel's every-3-SkyBlock-days)
  # break    — the next one counts down `break` after the last one ended
  # manual   — only /royalcontests start
  mode: interval
  interval: 1h
  # Shift from the top of the hour: 15m starts contests at :15.
  offset: 0m
  break: 40m
  # sequential — events.yml rotation in order · random — weighted by each event's `weight`
  selection: sequential
  # Announce an upcoming contest this long before it starts.
  announce-before: [30m, 10m]
  # How many upcoming contests /contests calendar shows.
  calendar-size: 5

# ── Contests ──────────────────────────────────────────────────────────────────
contest:
  # Worlds contests count in, unless an event lists its own. * is a wildcard:
  # "garden_*" is every RoyalGarden Garden.
  worlds:
    - "garden_*"
  default-duration: 20m
  default-countdown: 2m
  # Countdown announcements, by time left.
  countdown-announcements: [2m, 1m, 30s, 10s, 5s, 3s, 2s, 1s]
  # true: your first scoring crop is the only one you compete in (Hypixel rules).
  # false: you compete in every contest crop you farm, each ranked separately.
  lock-in: true
  # Score needed to be ranked and earn a bracket.
  minimum-score: 100
  # A restart mid-contest: "end" pays it out as it stands, "cancel" drops it.
  on-shutdown: end
  # Block bone meal in contest worlds while a contest runs.
  disable-bone-meal: false
  # Leaders announced per crop when a contest ends.
  broadcast-top: 3

# ── Scoring ───────────────────────────────────────────────────────────────────
# Every mode only counts fully grown crops, never player-placed blocks, only in
# contest worlds, only for the contest's crops.
scoring:
  # blocks      — `points` per block broken (crops.yml). Simple and exact.
  # drops       — crop items that actually drop, so Fortune counts. Plugins that
  #               pocket drops before they fall (auto-pickup, sacks) will hide them —
  #               use placeholder mode with those.
  # placeholder — the change in a collection placeholder since the player joined.
  #               Counts everything the collection plugin counts. Needs PlaceholderAPI.
  mode: blocks
  # For placeholder mode. %collection% is the crop's `collection` id from crops.yml.
  #   AuroraCollections: "%aurora_collections_farming_%collection%_count_raw%"
  #   EcoCollections:    "%ecocollections_%collection%_amount%"  (check your version)
  placeholder: "%aurora_collections_farming_%collection%_count_raw%"
  # Breaks past this many per second don't count (macro / insta-break guard). 0 = off.
  max-breaks-per-second: 30

# ── Who may compete ───────────────────────────────────────────────────────────
# PlaceholderAPI checks, all of which must pass when a player first scores.
#   - placeholder: "%ecoskills_farming%"
#     min: 10
#     message: "&cYou need &6Farming 10 &cto compete in contests!"
requirements: []

# ── Display ───────────────────────────────────────────────────────────────────
display:
  # boss-bar, action-bar or none
  type: boss-bar
  boss-bar:
    # pink, blue, red, green, yellow, purple, white
    color: yellow
    # progress, notched_6, notched_10, notched_12, notched_20
    overlay: progress
  # Only show it to players standing in a contest world.
  only-in-contest-worlds: true

# Sounds: "<sound> [volume] [pitch]", or "" for none.
sounds:
  countdown: "block.note_block.pling 1 1.2"
  start: "entity.player.levelup 1 1"
  join: "entity.experience_orb.pickup 1 1"
  end: "entity.firework_rocket.blast 1 1"
  claim: "entity.player.levelup 1 1.5"

# ── Rewards ───────────────────────────────────────────────────────────────────
rewards:
  # false: rewards wait in /contests to be claimed.
  # true: given at once to players who are online when the contest ends.
  auto-claim: false

leaderboards:
  refresh-seconds: 300
  size: 10

# ── Storage ───────────────────────────────────────────────────────────────────
storage:
  # sqlite or mysql
  type: sqlite
  sqlite-file: data.db
  mysql:
    host: localhost
    port: 3306
    database: royalcontests
    username: root
    password: ""
    pool-size: 4
    properties: "useSSL=false&allowPublicKeyRetrieval=true"
