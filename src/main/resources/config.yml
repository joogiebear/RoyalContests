# ============================================
#          Jacob's Contest Configuration
# ============================================

settings:
  # Prefix for all chat messages
  prefix: "&e&lJacob's Contest &8» &r"
  # Default contest duration (e.g., 20m, 10m, 5m, 30s)
  default-duration: 20m
  # Countdown before contest starts
  countdown: 2m
  # Display method: ACTION_BAR or BOSS_BAR
  display: BOSS_BAR
  # BossBar color: BLUE, GREEN, RED, YELLOW, PURPLE, PINK, WHITE
  bossbar-color: YELLOW
  # Sound played when contest starts
  start-sound: "entity.player.levelup"
  # Sound played when contest ends
  end-sound: "entity.firework_rocket.blast"

  # ---- Skill Requirement ----
  # Players must meet this requirement to participate.
  # Uses PlaceholderAPI — works with EcoSkills, AuraSkills, mcMMO, etc.
  # Set enabled: false to let anyone participate.
  skill-requirement:
    enabled: true
    # The PAPI placeholder to check (without % signs)
    placeholder: "ecoskills_farming_level"
    # Minimum value required
    minimum: 10
    # Message shown when player doesn't meet requirement
    deny-message: "&cYou need &6Farming Level 10 &cto participate in Jacob's Contest!"

  # ---- Minimum Score ----
  # Players must reach this score to earn ANY rewards.
  # Below this threshold, they get nothing (not even participation).
  minimum-score: 100
  minimum-score-message: "&cYou need at least &6100 crops &cto earn rewards! You collected &6%score%&c."

  # ---- Auto Rotation ----
  # Automatically cycles through events in the rotation list.
  auto-rotation:
    enabled: true
    # Time between contests (break/downtime after one ends before next countdown starts)
    # 1 hour = 1 in-game day (roughly 3 in-game days break)
    break-between: 1h
    # Set to false to stop rotation after current contest
    # (useful for manual override without disabling config)
    announce-next: true
    # Message broadcast when next contest is announced
    next-contest-message: "&e&lJacob's Contest &8» &fNext contest: %event% &fin &6%time%"

# ============================================
#     Bracket Definitions (by percentile)
# ============================================
# threshold = top X% of participants qualify
# Brackets are checked top-down: first match wins
# All commands run as console. Available placeholders:
#   %player% - player name
#   %crop% - crop the player farmed (lowercase)
#   %score% - number of crops broken
#   %bracket% - bracket name
#   %position% - player's rank

brackets:
  DIAMOND:
    threshold: 2
    color: "&b"
    display-name: "&b&lDIAMOND"
    commands:
      - "eco give %player% gold_medal 1"
      - "eco give %player% silver_medal 1"
      - "eco give %player% jacobs_ticket 35"
      - "eco give %player% carnival_ticket 3"
      - "eco give %player% turbo_crop_%crop%_1 1"
  PLATINUM:
    threshold: 5
    color: "&7"
    display-name: "&7&lPLATINUM"
    commands:
      - "eco give %player% gold_medal 1"
      - "eco give %player% bronze_medal 1"
      - "eco give %player% jacobs_ticket 30"
      - "eco give %player% carnival_ticket 2"
      - "eco give %player% turbo_crop_%crop%_1 1"
  GOLD:
    threshold: 10
    color: "&6"
    display-name: "&6&lGOLD"
    commands:
      - "eco give %player% gold_medal 1"
      - "eco give %player% jacobs_ticket 25"
      - "eco give %player% carnival_ticket 2"
      - "eco give %player% turbo_crop_%crop%_1 1"
  SILVER:
    threshold: 30
    color: "&f"
    display-name: "&f&lSILVER"
    commands:
      - "eco give %player% silver_medal 1"
      - "eco give %player% jacobs_ticket 15"
      - "eco give %player% carnival_ticket 1"
      - "eco give %player% turbo_crop_%crop%_1 1"
  BRONZE:
    threshold: 60
    color: "&c"
    display-name: "&c&lBRONZE"
    commands:
      - "eco give %player% bronze_medal 1"
      - "eco give %player% jacobs_ticket 10"
      - "eco give %player% carnival_ticket 1"
      - "eco give %player% turbo_crop_%crop%_1 1"
  NONE:
    threshold: 100
    color: "&7"
    display-name: "&7NONE"
    commands:
      - "eco give %player% jacobs_ticket 1"

# ============================================
#     Point Values Per Item Drop
# ============================================
# Scoring is based on ACTUAL ITEM DROPS, not block breaks.
# Fortune, Eco enchants, pets, talismans, reforges, etc.
# all affect drops and therefore affect score.
#
# Vanilla items use their material name.
# EcoItems use "ecoitems:item_id" format.
# Any item not listed = 0 points (ignored).

point-values:
  # Vanilla crop drops
  WHEAT: 1
  CARROT: 1
  POTATO: 1
  BEETROOT: 1
  NETHER_WART: 1
  MELON_SLICE: 1
  PUMPKIN: 1
  # Seeds don't count (or set to 0 explicitly)
  WHEAT_SEEDS: 0
  BEETROOT_SEEDS: 0
  # EcoItems — enchanted crops worth more
  # Uncomment and set your actual EcoItems IDs:
  # ecoitems:enchanted_wheat: 5
  # ecoitems:enchanted_carrot: 5
  # ecoitems:enchanted_potato: 5
  # ecoitems:enchanted_nether_wart: 5
  # ecoitems:enchanted_melon: 10
  # ecoitems:enchanted_pumpkin: 10

# ============================================
#           Event Definitions
# ============================================
# Each event defines which crops, duration, and worlds

events:
  summer_harvest:
    display-name: "&eSummer Harvest"
    duration: 10m
    countdown: 2m
    crops:
      - WHEAT
      - CARROTS
      - POTATOES
    worlds:
      - SuperiorWorld

  nether_harvest:
    display-name: "&cNether Harvest"
    duration: 8m
    countdown: 2m
    crops:
      - NETHER_WART
    worlds:
      - SuperiorWorld

  melon_madness:
    display-name: "&aMelon Madness"
    duration: 5m
    countdown: 1m
    crops:
      - MELON
      - PUMPKIN
    worlds:
      - SuperiorWorld

# ============================================
#         Event Rotation
# ============================================
# Events cycle through this list in order

rotation:
  - summer_harvest
  - nether_harvest
  - melon_madness

# ============================================
#            Messages
# ============================================
# Supports & color codes and placeholders

messages:
  contest-countdown: "&e&lJacob's Contest &8» &f%event% &fstarts in &6%time%&f! Crops: &6%crops%"
  contest-started: "&e&lJacob's Contest &8» &f%event% &fhas begun! Break &6%crops% &fto compete!"
  contest-ended: "&e&lJacob's Contest &8» &f%event% &fhas ended!"
  results-header: "&e&l  ═══ Contest Results ═══"
  bracket-result: "  %bracket_display% &8» &f%player% &7(#%position% — %score% crops)"
  player-locked: "&e&lJacob's Contest &8» &fYou are now competing with &6%crop%&f!"
  player-wrong-crop: "&e&lJacob's Contest &8» &cYou are locked to &6%crop%&c!"
  not-in-event-world: "&e&lJacob's Contest &8» &cThis contest is not active in this world!"
  no-active-contest: "&e&lJacob's Contest &8» &cNo contest is currently active."
  contest-already-active: "&e&lJacob's Contest &8» &cA contest is already running!"
  event-not-found: "&e&lJacob's Contest &8» &cEvent '%event%' not found!"
  bossbar-text: "&e&lJacob's Contest &8| &f%crop%: &6%score% &8| &f⏱ &6%time%"
  below-minimum: "&7%player% did not reach the minimum score (%score%/%minimum%)"
  next-contest: "&e&lJacob's Contest &8» &fNext contest in &6%time%&f!"
