name: RoyalContests
version: '${project.version}'
main: com.mystipixel.royalcontests.RoyalContests
api-version: '26.2'
author: Mystipixel
description: Jacob's-style farming contests for the Royal suite.
softdepend: [PlaceholderAPI, RoyalSkyblock]
commands:
  royalcontests:
    description: Run farming contests (admin).
    usage: /royalcontests <start|stop|cancel|status|calendar|reload>
    permission: royalcontests.admin
    aliases: [jacobscontest, jc, rc]
  contests:
    description: The contest hub — current contest, rewards, stats, calendar and leaderboards.
    usage: /contests [claim|stats|calendar|top]
    permission: royalcontests.menu
permissions:
  royalcontests.admin:
    description: Start, stop and configure contests.
    default: op
  royalcontests.menu:
    description: Open /contests and claim rewards.
    default: true
