name: JacobsContest
version: '${project.version}'
main: com.jacobscontest.JacobsContest
api-version: '1.21'
authors: [VoltexaLeader]
description: Competitive crop farming contests with percentage-based bracket rewards
softdepend:
  - PlaceholderAPI
commands:
  jacobscontest:
    description: Manage Jacob's Contest events (admin)
    usage: /jacobscontest <start|stop|reload|status> [event]
    permission: jacobscontest.admin
    aliases: [jc, jacobs]
  contests:
    description: Open the Jacob's Contest menu
    usage: /contests
    permission: jacobscontest.menu
permissions:
  jacobscontest.admin:
    description: Access to all Jacob's Contest admin commands
    default: op
  jacobscontest.menu:
    description: Open the contest menu
    default: true
