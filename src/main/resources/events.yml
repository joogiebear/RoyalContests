# ═══════════════════════════════════════════════════════════════════════════════
#  RoyalContests  ·  events.yml
# ═══════════════════════════════════════════════════════════════════════════════
#  The kinds of contest. Per event:
#    display-name  : shown to players
#    crops         : crop ids from crops.yml
#    random-crops  : if set, each contest picks this many of `crops` at random
#                    (Hypixel: 3 of the full list). Leave out to use them all.
#    duration      : how long it runs    (default: contest.default-duration)
#    countdown     : warning before start (default: contest.default-countdown)
#    worlds        : world patterns       (default: contest.worlds)
#    weight        : how often `random` selection picks it (default 1)
#
#  rotation: the order `sequential` selection runs them in, and the events
#  `random` picks from. Leave it out to use every event, in file order.
# ═══════════════════════════════════════════════════════════════════════════════

events:
  jacobs:
    display-name: "&e&lJacob's Farming Contest"
    crops: [wheat, carrot, potato, nether_wart, melon, pumpkin, sugar_cane, cactus, cocoa, mushroom]
    random-crops: 3
    duration: 20m

  summer_harvest:
    display-name: "&eSummer Harvest"
    crops: [wheat, carrot, potato]
    duration: 20m

  nether_harvest:
    display-name: "&cNether Harvest"
    crops: [nether_wart]
    duration: 20m

  melon_madness:
    display-name: "&aMelon Madness"
    crops: [melon, pumpkin]
    duration: 20m

rotation:
  - jacobs
