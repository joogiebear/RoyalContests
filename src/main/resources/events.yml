# ============================================
#     Jacob's Contest - Event Definitions
# ============================================
# Define as many events as you want.
# Each event specifies which crops, duration, and worlds.

events:
  summer_harvest:
    display-name: "&eSummer Harvest"
    duration: 20m
    countdown: 2m
    crops:
      - WHEAT
      - CARROTS
      - POTATOES
    worlds:
      - SuperiorWorld

  nether_harvest:
    display-name: "&cNether Harvest"
    duration: 20m
    countdown: 2m
    crops:
      - NETHER_WART
    worlds:
      - SuperiorWorld

  melon_madness:
    display-name: "&aMelon Madness"
    duration: 20m
    countdown: 2m
    crops:
      - MELON
      - PUMPKIN
    worlds:
      - SuperiorWorld

# ============================================
#         Event Rotation Order
# ============================================
# Events cycle through this list in order.
# Must match event IDs defined above.

rotation:
  - summer_harvest
  - nether_harvest
  - melon_madness
